name: Build and Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: cr.yandex
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: diplom-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        id: login-cr
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.1'

      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          
          # Сохраняем SA-ключ
          cat > $HOME/sa-key.json <<'EOF'
          ${{ secrets.YC_SA_KEY }}
          EOF
          
          # Путь к yc
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          
          # ЯВНО настраиваем yc на использование SA-ключа
          yc config profile create sa-profile || true
          yc config set service-account-key $HOME/sa-key.json
          
          # Получаем IAM-токен
          IAM_TOKEN=$(yc iam create-token)
          echo "::add-mask::$IAM_TOKEN"
          
          # Подставляем токен в kubeconfig
          sed -i "s|PLACEHOLDER_TOKEN|$IAM_TOKEN|g" ~/.kube/config
          
          # Проверяем доступ
          kubectl get nodes

      - name: Update deployment image
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          echo "Deploying version: ${VERSION}"
          kubectl set image deployment/diplom-app \
            diplom-app=${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${VERSION} \
            -n diplom

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/diplom-app -n diplom --timeout=5m
